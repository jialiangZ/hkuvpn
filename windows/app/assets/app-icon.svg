<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A6047"/>
      <stop offset="1" stop-color="#003F2E"/>
    </linearGradient>
  </defs>

  <!-- HKU green tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect x="7" y="7" width="242" height="242" rx="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- academic shield -->
  <path d="M128 38 L196 64 V126 C196 170 166 201 128 218 C90 201 60 170 60 126 V64 Z"
        fill="#FFFFFF" fill-opacity="0.06"
        stroke="#D8B45E" stroke-width="9" stroke-linejoin="round"/>

  <!-- open book -->
  <path d="M78 105 C96 97 116 99 128 109 L128 153 C116 145 96 143 78 151 Z" fill="#FFFFFF"/>
  <path d="M178 105 C160 97 140 99 128 109 L128 153 C140 145 160 143 178 151 Z" fill="#FFFFFF"/>
  <path d="M128 109 V153" stroke="#0A6047" stroke-width="5" stroke-linecap="round"/>

  <!-- founding year -->
  <text x="128" y="190" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif"
        font-size="24" font-weight="bold" letter-spacing="3" fill="#D8B45E">1911</text>
</svg>
