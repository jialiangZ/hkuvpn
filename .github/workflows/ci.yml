name: ci

# The Go part of the app is the only thing that can be checked without an
# HKU account: the session lifecycle regression (windows/tests/session-flow.ps1)
# needs a real account, a Portal PIN and the live gateway, so it stays a
# manual script. See windows/README.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: windows/mygo-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: windows/mygo-app/go.mod
          cache-dependency-path: windows/mygo-app/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        # The app is a Windows program on every runner: GOOS=windows
        # picks Go's own Windows linker, which is what understands
        # -H=windowsgui. Without it the flag would switch the host
        # linker to its mingw mode, and the native gcc would refuse.
        env:
          GOOS: windows
          GOARCH: amd64
        run: >-
          go build -trimpath
          -ldflags "-s -w -H=windowsgui -X github.com/egoist/mygo.production=1"
          -o HKUVPN.exe .
