name: release

# A tag (v1.2.0) builds the Windows app and attaches the bundle to the
# GitHub release, so nobody has to install Go to try it.
#
# The bundle is the app plus the worker it drives. The two dependencies
# that cannot travel with it - OpenConnect (it installs the Wintun driver,
# so it needs an administrator) and gost - are fetched by bin/get-tools.ps1
# in the bundle, with their SHA-256 hashes pinned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: windows/mygo-app/go.mod
          cache-dependency-path: windows/mygo-app/go.sum

      - name: Vet and test
        working-directory: windows/mygo-app
        run: |
          go vet ./...
          go test ./...

      - name: Build the app
        working-directory: windows/mygo-app
        env:
          GOOS: windows
          GOARCH: amd64
        run: >-
          go build -trimpath
          -ldflags "-s -w -H=windowsgui -X github.com/egoist/mygo.production=1"
          -o HKUVPN.exe .

      - name: Pack the bundle
        shell: pwsh
        run: |
          # A file that fails to copy must fail the step: otherwise the
          # archive is published half-empty and nobody notices.
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Path bundle/bin -Force | Out-Null
          New-Item -ItemType Directory -Path bundle/shell -Force | Out-Null
          New-Item -ItemType Directory -Path bundle/etc -Force | Out-Null
          New-Item -ItemType Directory -Path bundle/examples -Force | Out-Null
          Copy-Item windows/mygo-app/HKUVPN.exe bundle/
          Copy-Item windows/bin/hkuvpn.ps1 bundle/bin/
          Copy-Item windows/bin/get-tools.ps1 bundle/bin/
          # The bare-`hkuvpn` entry point and its orphan guard live in shell\,
          # not bin\: PowerShell runs a .ps1 in preference to a .cmd with the
          # same base name, so hkuvpn.cmd must not sit next to hkuvpn.ps1.
          # install-path.ps1 puts shell\ on the user PATH.
          Copy-Item windows/shell/hkuvpn.cmd bundle/shell/
          Copy-Item windows/shell/hkuvpn-connect.ps1 bundle/shell/
          Copy-Item windows/shell/hkuvpn-watchdog.ps1 bundle/shell/
          Copy-Item windows/shell/bootstrap.ps1 bundle/shell/
          Copy-Item windows/shell/install-path.ps1 bundle/shell/
          Copy-Item windows/etc/vpnc-script-win.js bundle/etc/
          Copy-Item windows/examples/hku.env.example bundle/examples/
          Copy-Item windows/mygo-app/START-HERE.md bundle/
          Copy-Item windows/mygo-app/START-HERE.zh-CN.md bundle/

          # The archive is written by hand, one entry at a time.
          # Compress-Archive and the .NET Framework spell the paths with
          # backslashes ("bin\hkuvpn.ps1"), which is not what the zip
          # format says and which some extractors turn into files
          # literally named "bin\hkuvpn.ps1". Forward slashes work
          # everywhere.
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = "HKUVPN-windows-$tag.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          $fs = [IO.File]::Open($zip, [IO.FileMode]::Create)
          $archive = New-Object IO.Compression.ZipArchive($fs, [IO.Compression.ZipArchiveMode]::Create)
          # The entry name is the path relative to the bundle. The search
          # is for "." because the working directory is the bundle
          # itself: looking for "bundle" here would look for
          # bundle\bundle and find nothing, and the archive would be
          # published empty.
          Push-Location bundle
          foreach ($file in Get-ChildItem -Recurse -File .) {
              $name = (Resolve-Path -Relative $file.FullName) -replace '^\.[\\/]', ''
              $name = $name.Replace('\', '/')
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $file.FullName, $name) | Out-Null
          }
          Pop-Location
          $archive.Dispose()
          $fs.Dispose()
          # Verify what was actually written. The entry list of an archive
          # in Create mode stays empty until it is closed, so it has to be
          # reopened to be counted.
          $check = [IO.Compression.ZipFile]::OpenRead($zip)
          $count = $check.Entries.Count
          $check.Dispose()
          if ($count -lt 7) { throw "the archive has $count entries - something did not get copied" }

          # The hash next to the archive, so a student can check it.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii
          Write-Host "packed $zip ($count entries)"
          Write-Host $hash

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $assets = @("HKUVPN-windows-$tag.zip", "HKUVPN-windows-$tag.zip.sha256")
          $notes = @'
          ### The Windows app

          `HKUVPN-windows-<version>.zip` holds the desktop app and the
          worker it drives. Unpack it anywhere, run `bin\get-tools.ps1`
          once as administrator (it installs OpenConnect and downloads
          gost, both SHA-256 verified), then start `HKUVPN.exe`.

          `START-HERE.md` and `START-HERE.zh-CN.md` in the archive have
          the full steps, in English and in Chinese.

          For a shell, run `shell\bootstrap.ps1` once (account and Portal
          PIN; it can record a campus subnet too), then
          `shell\install-path.ps1` once: it puts `shell` on the user PATH
          (no administrator rights), and then a bare `hkuvpn` connects from
          any terminal, `hkuvpn --status` reports,
          and `hkuvpn --stop` stops. Closing the terminal after
          "Connected" leaves the tunnel up.

          The Docker edition is unchanged - see the README.
          '@
          # The check uses the exit code, not the output: a native
          # command that fails throws under PowerShell 7's
          # ErrorActionPreference, and "no such release" is the normal
          # answer here, not an error.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release is already there (it was made by hand, or by an
            # earlier run): upload the build without touching its notes.
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          } else {
            $notes | Out-File notes.md -Encoding utf8
            gh release create $tag --title "hkuvpn $tag" --notes-file notes.md @assets
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
