<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364" role="img" aria-labelledby="title desc">
<title id="title">Let a campus computer use your local proxy</title>
<desc id="desc">First establish SSH from your machine through HKU. Campus tools use remote port 8152, forwarded back to your local proxy on port 6152, to reach external services.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
<rect x="1" y="1" width="998" height="362" rx="18" fill="#fff" stroke="#dce3eb"/>
<text x="36" y="53" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">Let a campus computer use your local proxy</text>
<text x="36" y="86" font-size="18" font-weight="400" fill="#475569" text-anchor="start">For tools running on campus when the working proxy is on your machine</text>
<rect x="36" y="122" width="256" height="148" rx="14" fill="#eff6ff" stroke="#b9d2f6"/>
<text x="56" y="157" font-size="23" font-weight="650" fill="#0f172a" text-anchor="start">Campus computer</text>
<text x="56" y="191" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Dev tools / Git</text>
<text x="56" y="245" font-size="17" font-weight="400" fill="#475569" text-anchor="start">127.0.0.1:8152</text>
<rect x="412" y="122" width="256" height="148" rx="14" fill="#ecfdf5" stroke="#a7d9c2"/>
<text x="432" y="157" font-size="23" font-weight="650" fill="#0f172a" text-anchor="start">Your machine</text>
<text x="432" y="191" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Existing HTTP proxy</text>
<text x="432" y="245" font-size="17" font-weight="400" fill="#475569" text-anchor="start">127.0.0.1:6152</text>
<rect x="760" y="122" width="204" height="148" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
<text x="780" y="157" font-size="20" font-weight="650" fill="#0f172a" text-anchor="start">External services</text>
<text x="780" y="191" font-size="18" font-weight="400" fill="#475569" text-anchor="start">AI / code hosting</text>
<path d="M304 206 H392" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M390 200 L400 206 L390 212" fill="#2563eb"/>
<text x="352" y="175" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">SSH reverse</text>
<text x="352" y="193" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">forward</text>
<path d="M680 206 H740" fill="none" stroke="#047857" stroke-width="3"/><path d="M738 200 L748 206 L738 212" fill="#047857"/>
<text x="714" y="181" font-size="15" font-weight="500" fill="#047857" text-anchor="middle">via proxy</text>
<text x="36" y="307" font-size="17" font-weight="400" fill="#475569" text-anchor="start">First: your machine opens SSH via HKU. Arrows show requests from campus tools.</text>
<text x="36" y="336" font-size="16" font-weight="400" fill="#475569" text-anchor="start">8152 / 6152 are example ports; both listeners bind to their own localhost.</text>
</g>
</svg>
