<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="436" viewBox="0 0 1000 436" role="img" aria-labelledby="title desc">
<title id="title">Campus access via HKU. Everything else as usual.</title>
<desc id="desc">Campus requests selected by application settings or routing rules use Docker-VPN. Other requests keep their existing network or proxy.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
<rect x="1" y="1" width="998" height="434" rx="18" fill="#fff" stroke="#dce3eb"/>
<text x="36" y="53" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">Campus access via HKU. Everything else as usual.</text>
<text x="36" y="86" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Choose traffic with application proxy settings or routing rules</text>
<rect x="36" y="120" width="252" height="108" rx="14" fill="#ecfdf5" stroke="#a7d9c2"/>
<text x="56" y="160" font-size="23" font-weight="650" fill="#047857" text-anchor="start">Campus requests</text>
<text x="56" y="192" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Browser / SSH / desktop</text>
<rect x="364" y="120" width="280" height="108" rx="14" fill="#ecfdf5" stroke="#a7d9c2"/>
<text x="384" y="160" font-size="23" font-weight="650" fill="#047857" text-anchor="start">Docker-VPN</text>
<text x="384" y="192" font-size="16" font-weight="400" fill="#475569" text-anchor="start">OpenConnect inside Docker</text>
<rect x="720" y="120" width="244" height="108" rx="14" fill="#ecfdf5" stroke="#a7d9c2"/>
<text x="740" y="160" font-size="23" font-weight="650" fill="#047857" text-anchor="start">HKU network</text>
<text x="740" y="192" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Campus sites &amp; computers</text>
<path d="M300 174 H344" fill="none" stroke="#047857" stroke-width="3"/><path d="M342 168 L352 174 L342 180" fill="#047857"/>
<path d="M656 174 H700" fill="none" stroke="#047857" stroke-width="3"/><path d="M698 168 L708 174 L698 180" fill="#047857"/>
<rect x="36" y="260" width="252" height="108" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
<text x="56" y="300" font-size="23" font-weight="650" fill="#475569" text-anchor="start">Other requests</text>
<text x="56" y="332" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Everyday browsing / AI</text>
<rect x="364" y="260" width="280" height="108" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
<text x="384" y="300" font-size="23" font-weight="650" fill="#475569" text-anchor="start">Existing connection</text>
<text x="384" y="332" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Your usual network or proxy</text>
<rect x="720" y="260" width="244" height="108" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
<text x="740" y="300" font-size="23" font-weight="650" fill="#475569" text-anchor="start">Internet</text>
<text x="740" y="332" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Websites &amp; services</text>
<path d="M300 314 H344" fill="none" stroke="#475569" stroke-width="3"/><path d="M342 308 L352 314 L342 320" fill="#475569"/>
<path d="M656 314 H700" fill="none" stroke="#475569" stroke-width="3"/><path d="M698 308 L708 314 L698 320" fill="#475569"/>
<text x="500" y="407" font-size="18" font-weight="500" fill="#475569" text-anchor="middle">Only selected traffic enters HKU · Host default route stays unchanged</text>
</g>
</svg>
