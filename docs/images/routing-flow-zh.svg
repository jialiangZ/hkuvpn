<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="436" viewBox="0 0 1000 436" role="img" aria-labelledby="title desc">
<title id="title">校园访问走 HKU，其他访问照常</title>
<desc id="desc">应用或分流规则选中的校园请求，经 hkuvpn 到达 HKU；其他请求走原有网络或代理。</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
<rect x="1" y="1" width="998" height="434" rx="18" fill="#fff" stroke="#dce3eb"/>
<text x="36" y="53" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">校园访问走 HKU，其他访问照常</text>
<text x="36" y="86" font-size="18" font-weight="400" fill="#475569" text-anchor="start">通过应用代理设置或分流规则选择流量</text>
<rect x="36" y="120" width="252" height="108" rx="14" fill="#ecfdf5" stroke="#a7d9c2"/>
<text x="56" y="160" font-size="23" font-weight="650" fill="#047857" text-anchor="start">校园访问</text>
<text x="56" y="192" font-size="16" font-weight="400" fill="#475569" text-anchor="start">浏览器 / SSH / 远程桌面</text>
<rect x="364" y="120" width="280" height="108" rx="14" fill="#ecfdf5" stroke="#a7d9c2"/>
<text x="384" y="160" font-size="23" font-weight="650" fill="#047857" text-anchor="start">hkuvpn</text>
<text x="384" y="192" font-size="16" font-weight="400" fill="#475569" text-anchor="start">OpenConnect 隧道（容器 / Windows 原生）</text>
<rect x="720" y="120" width="244" height="108" rx="14" fill="#ecfdf5" stroke="#a7d9c2"/>
<text x="740" y="160" font-size="23" font-weight="650" fill="#047857" text-anchor="start">HKU 校园网</text>
<text x="740" y="192" font-size="16" font-weight="400" fill="#475569" text-anchor="start">校内网站与电脑</text>
<path d="M300 174 H344" fill="none" stroke="#047857" stroke-width="3"/><path d="M342 168 L352 174 L342 180" fill="#047857"/>
<path d="M656 174 H700" fill="none" stroke="#047857" stroke-width="3"/><path d="M698 168 L708 174 L698 180" fill="#047857"/>
<rect x="36" y="260" width="252" height="108" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
<text x="56" y="300" font-size="23" font-weight="650" fill="#475569" text-anchor="start">其他访问</text>
<text x="56" y="332" font-size="16" font-weight="400" fill="#475569" text-anchor="start">日常上网 / AI 工具</text>
<rect x="364" y="260" width="280" height="108" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
<text x="384" y="300" font-size="23" font-weight="650" fill="#475569" text-anchor="start">原有网络 / 代理</text>
<text x="384" y="332" font-size="16" font-weight="400" fill="#475569" text-anchor="start">保留你已有的线路</text>
<rect x="720" y="260" width="244" height="108" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
<text x="740" y="300" font-size="23" font-weight="650" fill="#475569" text-anchor="start">互联网</text>
<text x="740" y="332" font-size="16" font-weight="400" fill="#475569" text-anchor="start">网站与外部服务</text>
<path d="M300 314 H344" fill="none" stroke="#475569" stroke-width="3"/><path d="M342 308 L352 314 L342 320" fill="#475569"/>
<path d="M656 314 H700" fill="none" stroke="#475569" stroke-width="3"/><path d="M698 308 L708 314 L698 320" fill="#475569"/>
<text x="500" y="407" font-size="18" font-weight="500" fill="#475569" text-anchor="middle">只改变你选中的流量 · 主机默认路由不变</text>
</g>
</svg>
