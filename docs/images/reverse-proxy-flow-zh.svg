<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="364" viewBox="0 0 1000 364" role="img" aria-labelledby="title desc">
<title id="title">学校电脑，也能用你本机的代理</title>
<desc id="desc">本机先经 HKU 建立 SSH 隧道。学校电脑上的工具连接远端 8152 端口，通过反向转发回到本机 6152 代理，再访问外部服务。</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
<rect x="1" y="1" width="998" height="362" rx="18" fill="#fff" stroke="#dce3eb"/>
<text x="36" y="53" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">学校电脑，也能用你本机的代理</text>
<text x="36" y="86" font-size="18" font-weight="400" fill="#475569" text-anchor="start">适用场景：工具在学校运行，可用代理在你本机</text>
<rect x="36" y="122" width="256" height="148" rx="14" fill="#eff6ff" stroke="#b9d2f6"/>
<text x="56" y="157" font-size="23" font-weight="650" fill="#0f172a" text-anchor="start">学校电脑</text>
<text x="56" y="191" font-size="18" font-weight="400" fill="#475569" text-anchor="start">开发工具 / Git</text>
<text x="56" y="245" font-size="17" font-weight="400" fill="#475569" text-anchor="start">127.0.0.1:8152</text>
<rect x="412" y="122" width="256" height="148" rx="14" fill="#ecfdf5" stroke="#a7d9c2"/>
<text x="432" y="157" font-size="23" font-weight="650" fill="#0f172a" text-anchor="start">你的本机</text>
<text x="432" y="191" font-size="18" font-weight="400" fill="#475569" text-anchor="start">已有 HTTP 代理</text>
<text x="432" y="245" font-size="17" font-weight="400" fill="#475569" text-anchor="start">127.0.0.1:6152</text>
<rect x="760" y="122" width="204" height="148" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
<text x="780" y="157" font-size="20" font-weight="650" fill="#0f172a" text-anchor="start">外部服务</text>
<text x="780" y="191" font-size="18" font-weight="400" fill="#475569" text-anchor="start">AI / 代码仓库</text>
<path d="M304 206 H392" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M390 200 L400 206 L390 212" fill="#2563eb"/>
<text x="352" y="175" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">反向 SSH</text>
<path d="M680 206 H740" fill="none" stroke="#047857" stroke-width="3"/><path d="M738 200 L748 206 L738 212" fill="#047857"/>
<text x="714" y="181" font-size="15" font-weight="500" fill="#047857" text-anchor="middle">访问</text>
<text x="36" y="307" font-size="17" font-weight="400" fill="#475569" text-anchor="start">先由本机经 HKU 建立 SSH 隧道；上图箭头表示远端工具发起的请求。</text>
<text x="36" y="336" font-size="16" font-weight="400" fill="#475569" text-anchor="start">8152 / 6152 为示例端口，两端均只监听各自的 127.0.0.1。</text>
</g>
</svg>
